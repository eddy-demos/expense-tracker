name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  install:
    name: Install dependencies
    runs-on: tenki-standard-medium-4c-8g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

  client-build:
    name: Client build
    needs: install
    runs-on: tenki-standard-medium-4c-8g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Build Vite client
        run: npm run build -w client
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  server-smoke:
    name: Server smoke test
    needs: install
    runs-on: tenki-standard-medium-4c-8g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Seed database
        run: npm run seed
      - name: Boot server and hit API
        run: |
          npm run dev -w server &
          SERVER_PID=$!
          for i in {1..20}; do
            if curl -fs http://localhost:3001/api/expenses > /dev/null; then
              echo "Server is up"
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:3001/api/expenses | head -c 200
          echo
          curl -fs "http://localhost:3001/api/summary" | head -c 200
          echo
          kill $SERVER_PID

  audit:
    name: npm audit (high+)
    needs: install
    runs-on: tenki-standard-medium-4c-8g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  node-matrix:
    name: Node ${{ matrix.node }} compatibility
    needs: install
    runs-on: tenki-standard-medium-4c-8g
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      - run: npm run build -w client